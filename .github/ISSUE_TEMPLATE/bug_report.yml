name: Bug report
description: Something went wrong in a session (crash, desync, join problem, wrong behaviour).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please check the [troubleshooting guide](https://github.com/ljkx/SkylineTogether/blob/main/docs/guide/troubleshooting.md) first.
        Logs from **every** player make most bugs fixable. In the Skyline Together panel click **Write diagnostics**, then:
        - **Installed from GitHub:** run `Collect-Logs.cmd` from the setup folder and attach the zip it puts on your Desktop.
        - **Installed from Paradox Mods:** attach `Logs\SkylineTogether.log` and the newest `Logs\SkylineTogether-diagnostics-*.txt`
          from `%USERPROFILE%\AppData\LocalLow\Colossal Order\Cities Skylines II\`.

        **Privacy:** issues are public. The files contain player names, Steam IDs and, for direct-IP bans, IP addresses (never
        passwords or chat). `Player.log` contains your Windows user name in file paths unless it was collected with
        `Collect-Logs.cmd`. If you do not want this public, say so and we will arrange another way to send the files.
        **Never attach crash dumps (`.dmp`) here**: they can contain passwords. Send them only privately, and only when asked.
        Details: [Reporting a bug](https://github.com/ljkx/SkylineTogether/blob/main/docs/guide/troubleshooting.md#reporting-a-bug).
  - type: dropdown
    id: installed-from
    attributes:
      label: Installed from
      options:
        - Paradox Mods
        - GitHub setup (Install.cmd)
        - Built myself
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: The Skyline Together version (Paradox Mods page, release name or the first line Install.cmd prints).
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build id
      description: Shown at the bottom of the Skyline Together panel ("Build …") and printed by Install.cmd. Give every player's build id.
      placeholder: "host: 1a2b3c4d5e6f, other player: 1a2b3c4d5e6f"
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: Game version
      description: "The Cities: Skylines II version from the main menu (bottom corner)."
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Who saw the problem?
      options:
        - Host
        - Joining player
        - Both
        - Solo test (record / replay)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what each player saw. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you were following the two-player checklist (docs/guide/testing.md or HOW-TO-TEST.txt), name the step number.
      placeholder: |
        1. Host loads a city and hosts
        2. The other player joins
        3. ...
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: Enabled code mods on each PC (names and versions), or "none / empty playset".
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach the log files or the Collect-Logs zip of each player (drag the files into this box). No crash dumps.
